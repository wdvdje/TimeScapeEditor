<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0000ff">
    <title>Create Event</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Create Event</h1>
    <div id="eventTypes" class="formbox">
      <button class="formbutton" onclick="formSwap('appointment')">
        <p>Appointment</p>
      </button>
      <button class="formbutton" onclick="formSwap('event')">
        <p>Event</p>
      </button>
      <button class="formbutton" onclick="formSwap('focus')">
        <p>Focus</p>
      </button>
      <button class="formbutton" onclick="formSwap=('job')">
        <p>Job</p>
      </button>
      <button class="formbutton" onclick="formSwap('meeting')">
        <p>Meeting</p>
      </button>
    </div>
    <div id="area-form" style="display: none;">
      <form id="form-appointment" class="dynamic-form" style="display: none;">
      	<h2>New Appointment</h2>
        <input type="text" class="main" id="appointmentTitle" name="appointmentTitle" placeholder="Appointment Title">
        <p>Date: <input type="date" class="spec" id="appointmentDate" name="appointmentDate">.</p>
      	<p>Start Time: <input type="time" class="spec" id="appointmentStartTime" name="appointmentStartTime">. End Time: <input type="time" class="spec" id="appointmentEndTime" name="appointmentEndTime">.</p>
        <p>Location: <input type="text" class="spec" id="appointmentLocation" name="appointmentLocation"></p>
        <h2>Appointment Details</h2>
        <p>Domain: <select name="domainSelect" id="domainSelect"></select>. Bucket: <select name="bucketSelect" id="bucketSelect"></select>.</p>
        <p>Appointment Type: 
          <button id="medicalAppointment" type="button" aria-controls="medicalDetails">Medical</button>
          <button id="interviewAppointment" type="button" aria-controls="interviewDetails">Interview</button>
          <button id="psychologicalAppointment" type="button" aria-controls="psychologicalDetails">Psychological</button>
          <button id="personalCareAppointment" type="button" aria-controls="personalCareDetails">Personal Care</button>
          <button id="personalServiceAppointment" type="button" aria-controls="personalServiceDetails">Personal Service</button>
          <button id="professionalServiceAppointment" type="button" aria-controls="professionalServiceDetails">Professional Service</button>
        <div id="medicalDetails" class="hidden">
          <p>Icon:</p>
        </div>
        <div id="interviewDetails" class="hidden">
          <p>Icon:</p>
        </div>
        <div id="psychologicalDetails" class="hidden">
          <p>Icon:</p>
        </div>
        <div id="personalCareDetails" class="hidden">
          <p>Icon:</p>
        </div>
        <div id="personalServiceDetails" class="hidden">
          <p>Icon:</p>
        </div>
        <div id="professionalServiceDetails" class="hidden">
          <p>Icon:</p>
        </div>
      </form>
      <form id="form-event" class="dynamic-form" style="display: none;">
        <h2>New Event</h2>
        <input type="text" class="main" id="eventTitle" name="eventTitle" placeholder="Event Title">
      </form>
      <form id="form-focus" class="dynamic-form" style="display: none;">
        <h2>New Focus</h2>
        <input type="text" class="main" id="focusTitle" name="focusTitle" placeholder="Focus Title">
        <p>Date: <input type="date" class="spec" id="focusDate" name="focusDate">.</p>
      </form>
      <form id="form-job" class="dynamic-form" style="display: none;">
        <h2>New Job</h2>
        <input type="text" class="main" id="jobTitle" name="jobTitle" placeholder="Job Title">
      </form>
      <form id="form-meeting" class="dynamic-form" sytle="display: none;">
        <h2>New Meeting</h2>
        <input type="text" class="main" id="meetingTitle" name="meetingTitle" placeholder="Meeting Title">
      </form>
    </div>
    <script src="java.js"></script>
    <script>revealOnClick('medicalAppointment', 'medicalDetails');</script>
    <script>revealOnClick('interviewAppointment', 'interviewDetails');</script>
    <script>revealOnClick('psychologicalAppointment', 'psychologicalDetails');</script>
    <script>revealOnClick('personalCareAppointment', 'personalCareDetails');</script>
    <script>revealOnClick('personalServiceAppointment', 'personalServiceDetails');</script>
    <script>revealOnClick('professionalServiceAppointment', 'medicalDetails');</script>
  </body>
</html>
