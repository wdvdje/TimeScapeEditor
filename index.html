<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>TimeScape Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>TimeScape Editor</h1>
    <p>Today is <span id="current-date"></span>. You have  events,  tasks, and  reminders.</p>
    <h2>Schedules & Calendars</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Today's Report</p>
      </button>
      <button class="formbutton">
        <p>This Week</p>
      </button>
      <button class="formbutton">
        <p>Calendar</p>
      </button>
    </div>
    <h2>Add & Manage Items</h2>
    <div class="formbox">
      <button class="formbutton" onclick="itemsOptions('createEvent.html', 'events.html', 'Events')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"> <path fill-rule="evenodd" clip-rule="evenodd" d="M5.3075 4H18.6925C19.4949 4 19.7858 4.08305 20.0792 4.23901C20.3725 4.39497 20.6027 4.62384 20.7596 4.91545C20.9165 5.20707 21 5.49633 21 6.294V18.706C21 19.5037 20.9165 19.7929 20.7596 20.0845C20.6027 20.3762 20.3725 20.605 20.0792 20.761C19.7858 20.9169 19.4949 21 18.6925 21H5.3075C4.50513 21 4.21417 20.9169 3.92084 20.761C3.62751 20.605 3.3973 20.3762 3.24042 20.0845C3.08354 19.7929 3 19.5037 3 18.706V6.294C3 5.49633 3.08354 5.20707 3.24042 4.91545C3.3973 4.62384 3.62751 4.39497 3.92084 4.23901C4.21417 4.08305 4.50513 4 5.3075 4Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M17 2V4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M7 2V4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M12 15.5L9.06105 17.0451L9.62233 13.7725L7.24469 11.4549L10.5305 10.9775L12 8L13.4694 10.9775L16.7553 11.4549L14.3776 13.7725L14.9389 17.0451L12 15.5Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </svg>
        <p>Events</p>
      </button>
      <button class="formbutton" onclick="itemsOptions('createTask.html', 'tasks.html', 'Tasks')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"> <path d="M7.1499 10.5L14.1299 17L22.1499 6" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M2 10.5L9.00115 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M13.0271 11.5537L17 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </svg>
        <p>Tasks</p>
      </button>
      <button class="formbutton" onclick="itemsOptions('createReminder.html', 'reminders.html', 'Reminders')">
        <p>Reminders</p>
      </button>
    </div>
    <h2>Edit & Manage Domains</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Personal</p>
      </button>
      <button class="formbutton">
        <p>Household</p>
      </button>
      <button class="formbutton">
        <p>Jobs</p>
      </button>
    </div>
    <h2>Additional Reports & Services</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Weather</p>
      </button>
      <button class="formbutton">
        <p>Habits & Routines</p>
      </button>
      <button class="formbutton">
        <p>Meals Planning & Tracking</p>
      </button>
    </div>
  <script src="java.js"></script>
</body>
</html>
