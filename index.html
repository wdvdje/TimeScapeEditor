<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>TimeScape Editor</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>TimeScape Editor</h1>
    <p>Today is . You have  events,  tasks, and  reminders.</p>
    <h2>Schedules & Calendars</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Today's Report</p>
      </button>
      <button class="formbutton">
        <p>This Week</p>
      </button>
      <button class="formbutton">
        <p>Calendar</p>
      </button>
    </div>
    <h2>Add & Manage Items</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Events</p>
      </button>
      <button class="formbutton">
        <p>Tasks</p>
      </button>
      <button class="formbutton">
        <p>Reminders</p>
      </button>
    </div>
    <h2>Edit & Manage Domains</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Personal</p>
      </button>
      <button class="formbutton">
        <p>Household</p>
      </button>
      <button class="formbutton">
        <p>Jobs</p>
      </button>
    </div>
    <h2>Additional Reports & Services</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Weather</p>
      </button>
      <button class="formbutton">
        <p>Habits & Routines</p>
      </button>
      <button class="formbutton">
        <p>Meals Planning & Tracking</p>
      </button>
    </div>
  <script src="java.js"></script>
</body>
</html>
