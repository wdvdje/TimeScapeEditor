<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>TimeScape Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>TimeScape Editor</h1>
    <p>Today is <span id="current-date"></span>. You have  events,  tasks, and  reminders.</p>
    <h2>Schedules & Calendars</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Today's Report</p>
      </button>
      <button class="formbutton">
        <p>This Week</p>
      </button>
      <button class="formbutton">
        <p>Calendar</p>
      </button>
    </div>
    <h2>Add & Manage Items</h2>
    <div class="formbox">
      <button class="formbutton" onclick="itemsOptions('createEvent.html', 'events.html', 'Events')">
        <p>Events</p>
      </button>
      <button class="formbutton" onclick="itemsOptions('createTask.html', 'tasks.html', 'Tasks')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"> <path d="M7.1499 10.5L14.1299 17L22.1499 6" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M2 10.5L9.00115 17" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M13.0271 11.5537L17 6" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </svg>
        <p>Tasks</p>
      </button>
      <button class="formbutton" onclick="itemsOptions('createReminder.html', 'reminders.html', 'Reminders')">
        <p>Reminders</p>
      </button>
    </div>
    <h2>Edit & Manage Domains</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Personal</p>
      </button>
      <button class="formbutton">
        <p>Household</p>
      </button>
      <button class="formbutton">
        <p>Jobs</p>
      </button>
    </div>
    <h2>Additional Reports & Services</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Weather</p>
      </button>
      <button class="formbutton">
        <p>Habits & Routines</p>
      </button>
      <button class="formbutton">
        <p>Meals Planning & Tracking</p>
      </button>
    </div>
  <script src="java.js"></script>
</body>
</html>
