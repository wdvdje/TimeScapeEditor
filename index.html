<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0000ff">
    <title>TimeScape Editor</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>TimeScape Editor</h1>
    <p>Today is <span id="current-date"></span>. You have  events,  tasks, and  reminders.</p>
    <h2>Schedules & Calendars</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Today's Report</p>
      </button>
      <button class="formbutton">
        <p>This Week</p>
      </button>
      <button class="formbutton">
        <p>Calendar</p>
      </button>
    </div>
    <h2>Add & Manage Items</h2>
    <div class="formbox">
      <button class="formbutton" onclick="itemsOptions('createEvent.html', 'manageEvents.html', 'Events')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"> <path fill-rule="evenodd" clip-rule="evenodd" d="M5.3075 4H18.6925C19.4949 4 19.7858 4.08305 20.0792 4.23901C20.3725 4.39497 20.6027 4.62384 20.7596 4.91545C20.9165 5.20707 21 5.49633 21 6.294V18.706C21 19.5037 20.9165 19.7929 20.7596 20.0845C20.6027 20.3762 20.3725 20.605 20.0792 20.761C19.7858 20.9169 19.4949 21 18.6925 21H5.3075C4.50513 21 4.21417 20.9169 3.92084 20.761C3.62751 20.605 3.3973 20.3762 3.24042 20.0845C3.08354 19.7929 3 19.5037 3 18.706V6.294C3 5.49633 3.08354 5.20707 3.24042 4.91545C3.3973 4.62384 3.62751 4.39497 3.92084 4.23901C4.21417 4.08305 4.50513 4 5.3075 4Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M17 2V4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M7 2V4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M12 15.5L9.06105 17.0451L9.62233 13.7725L7.24469 11.4549L10.5305 10.9775L12 8L13.4694 10.9775L16.7553 11.4549L14.3776 13.7725L14.9389 17.0451L12 15.5Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </svg>
        <p><strong>Events</strong></p>
      </button>
      <button class="formbutton" onclick="itemsOptions('createTask.html', 'manageTasks.html', 'Tasks')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"> <path d="M7.1499 10.5L14.1299 17L22.1499 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M2 10.5L9.00115 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M13.0271 11.5537L17 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </svg>
        <p><strong>Tasks</strong></p>
      </button>
      <button class="formbutton" onclick="itemsOptions('createReminder.html', 'manageReminders.html', 'Reminders')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"> <path fill-rule="evenodd" clip-rule="evenodd" d="M7.62531 15.2003L8.67493 20.3753C8.70238 20.5106 8.61493 20.6426 8.47961 20.67C8.44896 20.6762 8.41742 20.6766 8.38661 20.6712L3.21162 19.761C3.07563 19.7371 2.98479 19.6075 3.0087 19.4715C3.01735 19.4223 3.04052 19.3768 3.07524 19.341L7.20061 15.0762C7.29661 14.9769 7.45487 14.9743 7.55411 15.0703C7.59044 15.1055 7.61526 15.1508 7.62531 15.2003Z" fill="white"/> <path d="M3 12.0009C3 13.8262 3.44044 15.7275 5.14806 17.1943" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M12.1636 21C17.0587 20.9128 21 16.9171 21 12.0007C21 7.02976 16.9706 3 12 3C7.02944 3 3 7.02976 3 12.0007" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> <path d="M12 7V12H16.9963" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </svg>
        <p>Reminders</p>
      </button>
    </div>
    <h2>Edit & Manage Domains</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Personal</p>
      </button>
      <button class="formbutton">
        <p>Household</p>
      </button>
      <button class="formbutton">
        <p>Jobs</p>
      </button>
    </div>
    <h2>Additional Reports & Services</h2>
    <div class="formbox">
      <button class="formbutton">
        <p>Weather</p>
      </button>
      <button class="formbutton">
        <p>Habits & Routines</p>
      </button>
      <button class="formbutton">
        <p>Meals Planning & Tracking</p>
      </button>
    </div>
  <script src="java.js"></script>
</body>
</html>
