<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0000ff">
    <title>Today's Report</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Today's Report</h1>
    <button class="type" type="button" onclick="window.location.href='index.html'">Return to Index</button>
    <p>Date: <strong><span id="todayReportDateLabel"></span></strong></p>

    <div class="report-controls">
      <label for="todayReportDomainFilter">Domain</label>
      <select id="todayReportDomainFilter">
        <option value="all">All Domains</option>
        <option value="personal">Personal</option>
        <option value="household">Household</option>
        <option value="jobs">Jobs</option>
      </select>
    </div>

    <div class="report-summary" id="todayReportSummary"></div>

    <table class="itemsTable">
      <thead>
        <tr>
          <th>Type</th>
          <th>Title</th>
          <th>Domain</th>
          <th>Bucket</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="todayReportTableBody"></tbody>
    </table>

    <script src="java.js"></script>
  </body>
</html>
