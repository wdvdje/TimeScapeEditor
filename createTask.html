<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0000ff">
  <title>Create Task</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Create Task</h1>
  <div id="taskTypes" class="formbox">
    <button class="formbutton" onclick="formSwap('assignment', 'taskTypes', 'task-area-form')">
      <p>Assignment</p>
    </button>
    <button class="formbutton" onclick="formSwap('chore', 'taskTypes', 'task-area-form')">
      <p>Chore</p>
    </button>
    <button class="formbutton" onclick="formSwap('task', 'taskTypes', 'task-area-form')">
      <p>Task</p>
    </button>
  </div>
  <div id="task-area-form" style="display: none;">
    <form id="form-assignment" class="dynamic-form" style="display: none;">
      <h2>New Assignment</h2>
      <input type="text" class="main" id="assignmentTitle" name="assignmentTitle" placeholder="Assignment Title">
      <p>Due Date: <input type="date" class="spec" id="assignmentDueDate" name="assignmentDueDate">.</p>
      <p>Additional Details:</p>
      <input type="textarea" class="spec" name="assignmentAdditionalDetails">
      <button class="spec">Save</button>
    </form>
    <form id="form-chore" class="dynamic-form" style="display: none;">
      <h2>New Chore</h2>
      <input type="text" class="main" id="choreTitle" name="choreTitle" placeholder="Chore Title">
      <p>Due Date: <input type="date" class="spec" id="choreDueDate" name="choreDueDate">.</p>
      <p>Additional Details:</p>
      <input type="textarea" class="spec" name="choreAdditionalDetails">
      <button class="spec">Save</button>
    </form>
    <form id="form-task" class="dynamic-form" style="display: none;">
      <h2>New Task</h2>
      <input type="text" class="main" id="taskTitle" name="taskTitle" placeholder="Task Title">
      <p>Due Date: <input type="date" class="spec" id="taskDueDate" name="taskDueDate">.</p>
      <p>Additional Details:</p>
      <input type="textarea" class="spec" name="taskAdditionalDetails">
      <button class="type" id="saveTask" name="saveTask">Save</button>
    </form>
    <button class="formbutton" onclick="returnType('taskTypes', 'task-area-form')">Back</button>
  </div>
  <script src="java.js"></script>
</body>
</html>
