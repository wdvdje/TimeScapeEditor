<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0000ff">
    <title>Create Reminder</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Create Reminder</h1>
    <div id="reminderTypes" class="formbox">
      <button class="formbutton" onclick="formSwap('daily', 'reminderTypes', 'reminder-area-form')">
        <p>Daily</p>
      </button>
      <button class="formbutton" onclick="formSwap('routine', 'reminderTypes', 'reminder-area-form')">
        <svg width="24px" height="64px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M3.93751 7.996C5.41098 5.03473 8.46787 3 12 3C16.629 3 20.4418 6.49474 20.9439 10.9898M3.05493 13C3.55236 17.4999 7.36744 21 12 21C15.5328 21 18.5902 18.9645 20.0634 16.0023M3 4V8.5H7.5M21 20.5V16H16.5M11.5 9L10 12H14L12.5 15" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
        Routine
      </button>
      <button class="formbutton" onclick="formSwap('chore', 'reminderTypes', 'reminder-area-form')">
        <p>Chore</p>
      </button>
      <button class="formbutton" onclick="formSwap('oneTime', 'reminderTypes', 'reminder-area-form')">
        <p>One-Time</p>
      </button>
    </div>
    <div id="reminder-area-form" style="display: none;">
      <form id="form-daily" class="dynamic-form" style="display: none;">
        <h2>New Daily Reminder</h2>
        <input type="text" class="main" id="dailyTitle" name="dailyTitle" placeholder="Reminder Title">
        <p>Date: <input type="date" class="spec" id="dailyDate" name="dailyDate">.</p>
        <p>Time: <input type="time" class="spec" id="dailyTime" name="dailyTime">.</p>
        <h2>Additional Details:</h2>
        <input type="textarea" class="spec" name="dailyAdditionalDetails">
        <button type="button" class="type" onclick="returnType('reminderTypes', 'reminder-area-form')">Back</button>
        <button type="submit" class="type">Save</button>
      </form>
      <form id="form-routine" class="dynamic-form" style="display: none;">
        <h2>New Routine</h2>
        <input type="text" class="main" id="routineTitle" name="routineTitle" placeholder="Reminder Title">
        <p>Start Date: <input type="date" class="spec" id="routineStartDate" name="routineStartDate">.</p>
        <p>Time: <input type="time" class="spec" id="routineTime" name="routineTime">.</p>
        <p>Repeat: <select class="spec" id="routineFrequency" name="routineFrequency">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select></p>
        <h2>Additional Details:</h2>
        <input type="textarea" class="spec" name="routineAdditionalDetails">
        <button type="button" class="type" onclick="returnType('reminderTypes', 'reminder-area-form')">Back</button>
        <button type="submit" class="type">Save</button>
      </form>
      <form id="form-chore" class="dynamic-form" style="display: none;">
        <h2>New Chore</h2>
        <input type="text" class="main" id="choreTitle" name="choreTitle" placeholder="Chore Title">
        <p>Start Date: <input type="date" class="spec" id="choreStartDate" name="choreStartDate">.</p>
        <p>Time: <input type="time" class="spec" id="choreTime" name="choreTime">.</p>
        <p>Repeat: <select class="spec" id="choreFrequency" name="choreFrequency">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select></p>
        <h2>Additional Details:</h2>
        <input type="textarea" class="spec" name="choreAdditionalDetails">
        <button type="button" class="type" onclick="returnType('reminderTypes', 'reminder-area-form')">Back</button>
        <button type="submit" class="type">Save</button>
      </form>
      <form id="form-oneTime" class="dynamic-form" style="display: none;">
        <h2>New One-Time Reminder</h2>
        <input type="text" class="main" id="oneTimeTitle" name="oneTimeTitle" placeholder="Reminder Title">
        <p>Date: <input type="date" class="spec" id="oneTimeDate" name="oneTimeDate">.</p>
        <p>Time: <input type="time" class="spec" id="oneTimeTime" name="oneTimeTime">.</p>
        <h2>Additional Details:</h2>
        <input type="textarea" class="spec" name="oneTimeAdditionalDetails">
        <button type="button" class="type" onclick="returnType('reminderTypes', 'reminder-area-form')">Back</button>
        <button type="submit" class="type">Save</button>
      </form>
    </div>
    <script src="java.js"></script>
  </body>
</html>
